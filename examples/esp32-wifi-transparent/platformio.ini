; Firmware Arduino puro para validar o Wi-Fi transparente da ESP32 no QEMU.
; Nao ha sdkconfig especial, OpenETH ou biblioteca de compatibilidade.
[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
