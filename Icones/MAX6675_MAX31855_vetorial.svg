<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="Módulo MAX6675 MAX31855, placa azul vista frontal, vetorial">
<defs>
 <linearGradient id="pcb" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0763b8"/><stop offset=".47" stop-color="#00509b"/><stop offset="1" stop-color="#073e83"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2b4"/><stop offset=".25" stop-color="#d99f39"/><stop offset=".5" stop-color="#f6d581"/><stop offset=".8" stop-color="#a66b24"/><stop offset="1" stop-color="#ffdea2"/></linearGradient>
 <linearGradient id="tin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#9aa5ac"/><stop offset=".62" stop-color="#e9ebeb"/><stop offset="1" stop-color="#697782"/></linearGradient>
 <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4e5256"/><stop offset=".25" stop-color="#232528"/><stop offset="1" stop-color="#101217"/></linearGradient>
 <linearGradient id="cap" x1="0" x2="1"><stop stop-color="#b37a35"/><stop offset=".3" stop-color="#f7d38b"/><stop offset=".75" stop-color="#bd843e"/><stop offset="1" stop-color="#eec983"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#001b38" flood-opacity=".5"/></filter>
 <g id="headerHole"><circle r="24" fill="#00417d" stroke="#1177cd" stroke-width="2"/><circle r="19" fill="url(#gold)"/><circle r="14.2" fill="url(#tin)"/><circle r="8.8" fill="#fdfdfc" stroke="#84939e" stroke-width="1.5"/></g>
 <g id="mountHole"><circle r="34" fill="#00407c" stroke="#156fb5" stroke-width="2"/><circle r="28" fill="url(#gold)"/><circle r="21" fill="url(#tin)"/><circle r="16.4" fill="#fff" stroke="#87959d" stroke-width="1"/></g>
 <g id="icLead"><rect x="-9" y="-18" width="18" height="35" rx="2" fill="url(#tin)" stroke="#77828d" stroke-width="1.3"/><rect x="-6" y="-15" width="12" height="16" rx="1.2" fill="#eee" opacity=".65"/></g>
 <g id="smd"><rect x="-13" y="-11" width="26" height="22" rx="3" fill="#043a74"/><rect x="-12" y="-10" width="24" height="20" rx="2" fill="url(#tin)"/><rect x="-7" y="-10" width="14" height="20" fill="#d4aa68"/></g>
</defs>
