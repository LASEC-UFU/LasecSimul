<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="972" height="596" viewBox="0 0 243 149" role="img" aria-label="Módulo conversor ADC ADS1115 de 16 bits com dez terminais">
