<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 950" width="920" height="950">
<title>INA333 — placa com quatro pinos em cada lado</title>
<desc>Ilustração vetorial frontal unificada, com etiquetas dos oito terminais. Arte esquemática, não layout de fabricação.</desc>
<defs>
 <linearGradient id="pcb" x2="1" y2="1"><stop stop-color="#692c78"/><stop offset=".53" stop-color="#763180"/><stop offset="1" stop-color="#52225f"/></linearGradient>
 <linearGradient id="silver"><stop stop-color="#86838b"/><stop offset=".25" stop-color="#fff"/><stop offset=".5" stop-color="#a7a2ae"/><stop offset=".75" stop-color="#f6f4f8"/><stop offset="1" stop-color="#77717d"/></linearGradient>
 <linearGradient id="ceramic" x2="0" y2="1"><stop stop-color="#d8b99d"/><stop offset=".5" stop-color="#ae7e5e"/><stop offset="1" stop-color="#d1ac8d"/></linearGradient>
 <radialGradient id="gold"><stop stop-color="#fef2c1"/><stop offset=".7" stop-color="#dcbd7b"/><stop offset="1" stop-color="#8d6534"/></radialGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity=".35"/></filter>
 <g id="hole"><circle r="29" fill="#3c1746"/><circle r="22" fill="url(#gold)"/><circle r="16" fill="url(#silver)"/><circle r="12" fill="#eee9ef"/><circle r="9.8" fill="#fafafa"/></g>
 <g id="cap"><rect x="-31" y="-14" width="62" height="28" rx="4" fill="#321238"/><rect x="-26" y="-10" width="52" height="20" rx="3" fill="url(#ceramic)"/><rect x="-31" y="-12" width="13" height="24" rx="3" fill="url(#silver)"/><rect x="18" y="-12" width="13" height="24" rx="3" fill="url(#silver)"/></g>
 <g id="res"><rect x="-31" y="-14" width="62" height="28" rx="4" fill="#34143b"/><rect x="-25" y="-10" width="50" height="20" rx="3" fill="#242126"/><rect x="-31" y="-11" width="11" height="22" rx="2" fill="url(#silver)"/><rect x="20" y="-11" width="11" height="22" rx="2" fill="url(#silver)"/></g>
</defs>
<rect width="920" height="950" fill="#f7f5f9"/>
<path d="M90 36 H830 Q851 36 851 58 V891 Q851 914 827 914 H93 Q70 914 70 891 V58 Q70 36 90 36Z" fill="#42184c" filter="url(#shadow)"/>
<path d="M93 47 H827 Q840 47 840 60 V889 Q840 902 827 902 H93 Q81 902 81 889 V60 Q81 47 93 47Z" fill="url(#pcb)" stroke="#a35ca2" stroke-width="3"/>
<path d="M98 68 H823 V880 H98Z" fill="none" stroke="#4b1856" stroke-width="5" opacity=".8"/>
<!-- copper routing: stylized original-front features -->
<g fill="none" stroke="#45164f" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" opacity=".85">
 <path d="M190 330 H288 L349 387 H441"/><path d="M196 460 H314 L365 511 H428"/><path d="M192 603 H319 L365 563 H428"/>
 <path d="M488 500 H567 L628 428 V334 H710"/><path d="M489 554 H581 L630 601 H714"/>
 <path d="M350 154 V232 H457 V303"/><path d="M570 154 V249 H599 V330"/><path d="M345 694 V778 H250 V800"/><path d="M568 694 V773 H662 V800"/>
</g>
<g fill="none" stroke="#af46a7" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".75">
 <path d="M190 330 H288 L349 387 H441"/><path d="M196 460 H314 L365 511 H428"/><path d="M192 603 H319 L365 563 H428"/>
 <path d="M488 500 H567 L628 428 V334 H710"/><path d="M489 554 H581 L630 601 H714"/>
 <path d="M350 154 V232 H457 V303"/><path d="M570 154 V249 H599 V330"/><path d="M345 694 V778 H250 V800"/><path d="M568 694 V773 H662 V800"/>
</g>
<!-- exactly four top header holes -->
<g><use xlink:href="#hole" x="185" y="109"/><use xlink:href="#hole" x="365" y="109"/><use xlink:href="#hole" x="545" y="109"/><use xlink:href="#hole" x="725" y="109"/></g>
<!-- top silk labels -->
<g font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#fff" text-anchor="middle"><text x="185" y="187">GND</text><text x="365" y="187">3.3V</text><text x="545" y="187">VOUT</text><text x="725" y="187">VREF</text></g>
<!-- rear markings transferred onto this front -->
<text x="810" y="496" transform="rotate(90 810 496)" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="3">INA333</text>
<!-- trimmer potentiometer -->
<g filter="url(#shadow)"><rect x="129" y="285" width="139" height="137" rx="9" fill="#eeeef1" stroke="#96929d" stroke-width="5"/><rect x="139" y="294" width="119" height="116" rx="5" fill="#d7d4dc" stroke="#fff" stroke-width="4"/><circle cx="198" cy="353" r="42" fill="#9d99a2" stroke="#f8f8f8" stroke-width="7"/><circle cx="198" cy="353" r="30" fill="#d8d5db" stroke="#66636b" stroke-width="4"/><circle cx="198" cy="353" r="16" fill="#6c676e"/><path d="M187 353 H209 M198 342 V364" stroke="#efedf0" stroke-width="7" stroke-linecap="round"/><path d="M145 299 l23 1 -23 24Z M253 299 l-23 1 23 24Z M145 403 l23 -1 -23 -24Z M253 403 l-23 -1 23 -24Z" fill="#28252a"/></g>
<!-- small IC and nearby parts -->
<use xlink:href="#cap" x="362" y="262"/><use xlink:href="#res" x="548" y="268"/><use xlink:href="#cap" x="692" y="337"/>
<g filter="url(#shadow)"><rect x="390" y="324" width="113" height="96" rx="7" fill="#242126" stroke="#111014" stroke-width="4"/>
<g fill="url(#silver)"><rect x="380" y="336" width="19" height="17" rx="2"/><rect x="380" y="367" width="19" height="17" rx="2"/><rect x="380" y="398" width="19" height="17" rx="2"/><rect x="496" y="336" width="19" height="17" rx="2"/><rect x="496" y="367" width="19" height="17" rx="2"/><rect x="496" y="398" width="19" height="17" rx="2"/></g><circle cx="403" cy="339" r="4" fill="#888"/></g>
<use xlink:href="#cap" x="684" y="405"/><use xlink:href="#cap" x="683" y="482"/><use xlink:href="#cap" x="235" y="482"/><use xlink:href="#cap" x="241" y="557"/>
<use xlink:href="#res" x="390" y="448"/><use xlink:href="#res" x="683" y="567"/><text x="683" y="574" font-size="19" font-family="monospace" fill="#fff" text-anchor="middle">103</text>
<use xlink:href="#res" x="684" y="637"/><text x="684" y="644" font-size="19" font-family="monospace" fill="#fff" text-anchor="middle">E01</text>
<!-- main 8-pin IC -->
<g filter="url(#shadow)"><rect x="386" y="500" width="174" height="175" rx="7" fill="#201d24" stroke="#f4eaf5" stroke-width="5"/>
<g fill="url(#silver)"><rect x="367" y="516" width="25" height="19" rx="2"/><rect x="367" y="553" width="25" height="19" rx="2"/><rect x="367" y="590" width="25" height="19" rx="2"/><rect x="367" y="627" width="25" height="19" rx="2"/><rect x="554" y="516" width="25" height="19" rx="2"/><rect x="554" y="553" width="25" height="19" rx="2"/><rect x="554" y="590" width="25" height="19" rx="2"/><rect x="554" y="627" width="25" height="19" rx="2"/></g>
<circle cx="404" cy="656" r="7" fill="#818087"/><g font-family="Arial,Helvetica,sans-serif" fill="#c0bbc5" text-anchor="middle"><text x="475" y="565" font-size="29" font-weight="bold">INA333</text><text x="475" y="597" font-size="21">23C</text><text x="475" y="626" font-size="21">A5J7</text></g></g>
<!-- vias -->
<g><circle cx="296" cy="443" r="11" fill="#35103e" stroke="#a347a6" stroke-width="5"/><circle cx="620" cy="310" r="10" fill="#35103e" stroke="#a347a6" stroke-width="5"/><circle cx="300" cy="663" r="10" fill="#35103e" stroke="#a347a6" stroke-width="5"/></g>
<!-- bottom silk labels and four bottom holes -->
<g font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle"><text x="185" y="779">VIN+</text><text x="365" y="779">VIN−</text><text x="545" y="779">VCC</text><text x="725" y="779">GND</text></g>
<g><use xlink:href="#hole" x="185" y="840"/><use xlink:href="#hole" x="365" y="840"/><use xlink:href="#hole" x="545" y="840"/><use xlink:href="#hole" x="725" y="840"/></g>
</svg>
