name: Package Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (tag) ex.: v0.0.1"
        required: true
        type: string
      tag_repository:
        description: "Criar e enviar tag?"
        required: true
        default: true
        type: boolean
      publish_release:
        description: "Publicar Release?"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A release Windows não pode deixar de publicar o setup.exe porque o pacote Linux opcional
    # encontrou uma incompatibilidade própria. O job Linux continua visível e executa todos os
    # gates, mas somente ele é experimental/não bloqueante.
    continue-on-error: ${{ matrix.target == 'linux-x64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.os == 'windows-latest'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Sync extension version with release tag
        shell: bash
        run: |
          RAW_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          node -e "
            const fs = require('fs');
            const version = process.argv[1];

            const pkgPath = 'extension/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            // npm ci valida que package-lock.json bate com package.json -- sem isto aqui, ci falha
            // com 'package.json and package-lock.json ... are in sync' assim que a versao muda.
            const lockPath = 'extension/package-lock.json';
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
            lock.version = version;
            if (lock.packages && lock.packages[''] ) lock.packages[''].version = version;
            fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');

            console.log('extension version set to', version);
          " "$VERSION"

      - name: Install extension dependencies
        run: npm --prefix extension ci

      - name: Compile extension
        run: npm --prefix extension run compile

      - name: Setup MSYS2 toolchain for the Windows VPI module
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          path-type: inherit

      - name: Setup GHDL
        uses: ghdl/setup-ghdl@v1
        with:
          version: 6.0.0
          backend: mcode
          runtime: ${{ matrix.os == 'windows-latest' && 'ucrt64' || '' }}

      # setup-ghdl instala o pacote ucrt64 dentro do MSYS2, mas atualmente não adiciona
      # /ucrt64/bin ao GITHUB_PATH quando runtime != native. Converta explicitamente para caminhos
      # Windows, pois os próximos passos executam Node/PowerShell fora do shell MSYS2.
      - name: Export Windows GHDL toolchain paths
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          GHDL_BIN_WIN="$(cygpath -w /ucrt64/bin)"
          GHDL_EXE_WIN="$(cygpath -w /ucrt64/bin/ghdl.exe)"
          GCC_EXE_WIN="$(cygpath -w /ucrt64/bin/gcc.exe)"
          GHDL_PREFIX_WIN="$(cygpath -w /ucrt64/lib/ghdl)"
          printf '%s\n' "$GHDL_BIN_WIN" >> "$GITHUB_PATH"
          printf 'GHDL_PREFIX=%s\n' "$GHDL_PREFIX_WIN" >> "$GITHUB_ENV"
          printf 'LASECSIMUL_GHDL_PATH=%s\n' "$GHDL_EXE_WIN" >> "$GITHUB_ENV"
          printf 'LASECSIMUL_GHDL_BINARY=%s\n' "$GHDL_EXE_WIN" >> "$GITHUB_ENV"
          printf 'LASECSIMUL_FPGA_VPI_CC=%s\n' "$GCC_EXE_WIN" >> "$GITHUB_ENV"

      - name: Verify Windows GHDL toolchain visibility
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & $env:LASECSIMUL_GHDL_PATH --version
          if ($LASTEXITCODE -ne 0) { throw "GHDL integrado ao MSYS2 não executou" }
          & $env:LASECSIMUL_FPGA_VPI_CC --version
          if ($LASTEXITCODE -ne 0) { throw "GCC UCRT64 integrado ao MSYS2 não executou" }

      - name: Build FPGA VPI module
        run: npm run build:fpga-vpi

      - name: Build core
        # O pacote precisa somente do binário de produção. A suíte nativa completa é um gate local/
        # de CI dedicado; construir ALL_BUILD recompila as mesmas fontes em dezenas de testes e
        # alongava uma release Windows por mais de 20 minutos.
        run: node scripts/build-core.js --clean --config Release --target lasecsimul-core

      - name: Build devices
        run: node scripts/build-devices.js --clean --config Release

      - name: Build MCU adapters
        run: node scripts/build-mcu-adapters.js --clean --config Release

      - name: Run extension tests
        run: npm --prefix extension test

      - name: Verify GHDL integration
        run: node scripts/build-core.js --config Release --target ghdl_backend_real_ghdl_test && ctest --test-dir core/build -C Release -R ghdl_backend_real_ghdl --output-on-failure

      - name: Package release artifacts
        run: node scripts/package-release.js

      - name: Verify bundled GHDL runtime
        run: node scripts/test-bundled-ghdl.js

      - name: Verify embedded TAP signatures
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $driverRoot = "dist/cache/tap-windows6/9.27.0/extracted/dist.win10/amd64"
          $files = @("tap0901.sys", "tap0901.cat", "devcon.exe")
          foreach ($file in $files) {
            $path = Join-Path $driverRoot $file
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Assinatura Authenticode inválida em $path`: $($signature.Status)"
            }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lasecsimul-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Tag and Release
    needs: package
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lasecsimul-*
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f ! -name SHA256SUMS.txt -exec cp {} release-assets/ \;
          find artifacts -type f -name SHA256SUMS.txt -print0 |
            sort -z |
            xargs -0 cat > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt

      - name: Create Git Tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_repository }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      - name: Publish Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: "LasecSimul ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
